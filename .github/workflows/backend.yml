name: Backend Workflow

on:
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    environment:
      name: application

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: Backend

    steps:

      # ==========================================
      # 1. Checkout repository
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Configure AWS credentials using OIDC
      # ==========================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.aws_account_id }}:role/TodoApplicationGitHubActionsRole
          aws-region: ${{ vars.aws_region }}


      # ==========================================
      # 3. Install Python
      # ==========================================

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'


      # ==========================================
      # 4. Install dependencies
      # ==========================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ==========================================
      # 5. Build Docker image
      # ==========================================

      - name: Create Docker image
        run: |
          docker build \
            -t ${{ vars.ECR_REPOSITORY }}:${{ github.sha }} .


      # ==========================================
      # 6. Login to Amazon ECR
      # ==========================================

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      # ==========================================
      # 7. Push Docker image to ECR
      # ==========================================

      - name: Push Docker image to Amazon ECR
        run: |
          docker push ${{ vars.ECR_REPOSITORY }}:${{ github.sha }}


      # ==========================================
      # 8. Get running EC2 instances from ASG
      # ==========================================

      - name: Get EC2 instances
        run: |

          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names todo-app-asg \
            --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId' \
            --output text)

          echo "Instances: $INSTANCE_IDS"

          if [ -z "$INSTANCE_IDS" ]; then
            echo "No InService EC2 instances found."
            exit 1
          fi

          echo "INSTANCE_IDS=$INSTANCE_IDS" >> "$GITHUB_ENV"


      # ==========================================
      # 9. Select ONE instance for migration
      # ==========================================

      - name: Select instance for migration
        run: |

          MIGRATION_INSTANCE_ID=$(echo "$INSTANCE_IDS" | awk '{print $1}')

          echo "Migration instance: $MIGRATION_INSTANCE_ID"

          echo "MIGRATION_INSTANCE_ID=$MIGRATION_INSTANCE_ID" >> "$GITHUB_ENV"


      # ==========================================
      # 10. Pull Docker image on ALL EC2 instances
      # ==========================================

      - name: Pull Docker image using SSM
        run: |

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids $INSTANCE_IDS \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "ECR_REGISTRY=\"${{ vars.ECR_REPOSITORY }}\"",
              "ECR_REGISTRY=\"${ECR_REGISTRY%%/*}\"",
              "aws ecr get-login-password --region ${{ vars.aws_region }} | docker login --username AWS --password-stdin \"$ECR_REGISTRY\"",
              "docker pull ${{ vars.ECR_REPOSITORY }}:${{ github.sha }}"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"


      # ==========================================
      # 11. Wait for Docker pull to finish
      # ==========================================

      - name: Wait for Docker image pull
        run: |

          echo "Waiting for Docker image pull..."

          for i in {1..30}; do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$MIGRATION_INSTANCE_ID" \
              --query 'Status' \
              --output text)

            echo "Current status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Docker image pulled successfully."
              break
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "TimedOut" ]; then

              echo "Docker image pull failed."
              exit 1
            fi

            sleep 10

          done


      # ==========================================
      # 12. Run Django migrations
      # ==========================================

      - name: Run migration using SSM
        run: |

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$MIGRATION_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "IMAGE=\"${{ vars.ECR_REPOSITORY }}:${{ github.sha }}\"",
              "SECRET=$(aws secretsmanager get-secret-value --secret-id ${{ vars.secret_arn }} --query SecretString --output text)",
              "DB_NAME=$(echo \"$SECRET\" | jq -r '\''.DB_NAME'\'')",
              "DB_USER=$(echo \"$SECRET\" | jq -r '\''.DB_USER'\'')",
              "DB_PASSWORD=$(echo \"$SECRET\" | jq -r '\''.DB_PASSWORD'\'')",
              "DB_HOST=$(echo \"$SECRET\" | jq -r '\''.DB_HOST'\'')",
              "DB_PORT=$(echo \"$SECRET\" | jq -r '\''.DB_PORT'\'')",
              "SECRET_KEY=$(echo \"$SECRET\" | jq -r '\''.SECRET_KEY'\'')",
              "docker run --rm -e DB_NAME=\"$DB_NAME\" -e DB_USER=\"$DB_USER\" -e DB_PASSWORD=\"$DB_PASSWORD\" -e DB_HOST=\"$DB_HOST\" -e DB_PORT=\"$DB_PORT\" -e SECRET_KEY=\"$SECRET_KEY\" \"$IMAGE\" python manage.py migrate"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "Migration Command ID: $COMMAND_ID"

          echo "MIGRATION_COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"


      # ==========================================
      # 13. Wait for migration result
      # ==========================================

      - name: Check migration result
        run: |

          echo "Waiting for migration to finish..."

          for i in {1..30}; do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$MIGRATION_COMMAND_ID" \
              --instance-id "$MIGRATION_INSTANCE_ID" \
              --query 'Status' \
              --output text)

            echo "Migration status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Migration completed successfully."
              break
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "TimedOut" ]; then

              echo "Migration failed."

              aws ssm get-command-invocation \
                --command-id "$MIGRATION_COMMAND_ID" \
                --instance-id "$MIGRATION_INSTANCE_ID" \
                --query 'StandardErrorContent' \
                --output text

              exit 1
            fi

            sleep 10

          done

      # ==========================================
      # 14. Deploy backend container on all EC2 instances
      # ==========================================

      - name: Run backend container
        run: |

          aws ssm send-command \
            --instance-ids $INSTANCE_IDS \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",

              "IMAGE=\"${{ vars.ECR_REPOSITORY }}:${{ github.sha }}\"",

              "SECRET=$(aws secretsmanager get-secret-value --secret-id ${{ vars.secret_arn }} --query SecretString --output text)",

              "DB_NAME=$(echo \"$SECRET\" | jq -r '\''.DB_NAME'\'')",
              "DB_USER=$(echo \"$SECRET\" | jq -r '\''.DB_USER'\'')",
              "DB_PASSWORD=$(echo \"$SECRET\" | jq -r '\''.DB_PASSWORD'\'')",
              "DB_HOST=$(echo \"$SECRET\" | jq -r '\''.DB_HOST'\'')",
              "DB_PORT=$(echo \"$SECRET\" | jq -r '\''.DB_PORT'\'')",
              "SECRET_KEY=$(echo \"$SECRET\" | jq -r '\''.SECRET_KEY'\'')",

              "docker stop todo-backend || true",
              "docker rm todo-backend || true",

              "docker run -d --name todo-backend -p 80:8000 -e DB_NAME=\"$DB_NAME\" -e DB_USER=\"$DB_USER\" -e DB_PASSWORD=\"$DB_PASSWORD\" -e DB_HOST=\"$DB_HOST\" -e DB_PORT=\"$DB_PORT\" -e SECRET_KEY=\"$SECRET_KEY\" \"$IMAGE\""
            ]'

