name: Terraform Infrastructure

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: terraform

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.aws_account_id }}:role/TodoTerraformGitHubActionsRole
          aws-region: ${{ vars.aws_region }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve tfplan

      - name: Get Terraform Outputs
        id: terraform_outputs
        working-directory: ./terraform
        run: |
          echo "frontend_bucket=$(terraform output -raw frontend_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "backend_url=$(terraform output -raw alb_dns_name)" >> "$GITHUB_OUTPUT"
          echo "ecr_repository=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"
          echo "secret_arn=$(terraform output -raw secret_arn)" >> "$GITHUB_OUTPUT"

      - name: Update Application Variables
        env:
          GH_TOKEN: ${{ secrets.env_token }}
          FRONTEND_BUCKET: ${{ steps.terraform_outputs.outputs.frontend_bucket }}
          BACKEND_URL: ${{ steps.terraform_outputs.outputs.backend_url }}
          ECR_REPOSITORY: ${{ steps.terraform_outputs.outputs.ecr_repository }}
          SECRET_ARN: ${{ steps.terraform_outputs.outputs.secret_arn }}
          FRONTEND_WEBSITE_URL: ${{ steps.terraform_outputs.outputs.frontend_website_url }}

        run: |

          echo "========================================"
          echo "Terraform Outputs"
          echo "========================================"

          echo "Frontend Bucket: $FRONTEND_BUCKET"
          echo "Backend URL: $BACKEND_URL"
          echo "ECR Repository: $ECR_REPOSITORY"
          echo "Secret ARN: $SECRET_ARN"
          echo "Frontend Website URL: $FRONTEND_WEBSITE_URL"

          echo ""
          echo "========================================"
          echo "Updating GitHub Environment Variables"
          echo "========================================"

          echo "Updating frontend_bucket..."

          curl --fail-with-body \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${{ github.repository }}/environments/application/variables/frontend_bucket" \
            -d "{\"name\":\"frontend_bucket\",\"value\":\"$FRONTEND_BUCKET\"}"

          echo "Updating backend_url..."

          curl --fail-with-body \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${{ github.repository }}/environments/application/variables/backend_url" \
            -d "{\"name\":\"backend_url\",\"value\":\"$BACKEND_URL\"}"

          echo "Updating ecr_repository..."

          curl --fail-with-body \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${{ github.repository }}/environments/application/variables/ecr_repository" \
            -d "{\"name\":\"ecr_repository\",\"value\":\"$ECR_REPOSITORY\"}"

          echo "Updating secret_arn..."

          curl --fail-with-body \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${{ github.repository }}/environments/application/variables/secret_arn" \
            -d "{\"name\":\"secret_arn\",\"value\":\"$SECRET_ARN\"}"

          echo "Updating frontend_website_url..."
          curl --fail-with-body \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${{ github.repository }}/environments/application/variables/frontend_website_url" \
            -d "{\"name\":\"frontend_website_url\",\"value\":\"$FRONTEND_WEBSITE_URL\"}"          

          echo ""
          echo "========================================"
          echo "All Application Variables Updated"
          echo "========================================"
