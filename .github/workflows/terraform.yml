
name: Terraform Infrastructure

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: terraform

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.aws_account_id }}:role/TodoTerraformGitHubActionsRole
          aws-region: ${{ vars.aws_region }}

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve tfplan

      - name: Get Terraform Outputs
        working-directory: ./terraform
        run: |
          echo "frontend_bucket=$(terraform output -raw frontend_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "backend_url=$(terraform output -raw alb_dns_name)" >> "$GITHUB_OUTPUT"
          echo "ecr_repository=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"

      - name: Update Application Environment Variables
        working-directory: ./terraform
        env:
          GH_TOKEN: ${{ secrets.github_env_token }}
        run: |
          FRONTEND_BUCKET=$(terraform output -raw frontend_bucket_name)
          BACKEND_URL=$(terraform output -raw alb_dns_name)
          ECR_REPOSITORY=$(terraform output -raw ecr_repository_url)

          echo "Updating application environment variables..."

          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${{ github.repository }}/environments/application/variables/frontend_bucket" \
            -f name="frontend_bucket" \
            -f value="$FRONTEND_BUCKET"

          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${{ github.repository }}/environments/application/variables/backend_url" \
            -f name="backend_url" \
            -f value="$BACKEND_URL"

          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${{ github.repository }}/environments/application/variables/ecr_repository" \
            -f name="ecr_repository" \
            -f value="$ECR_REPOSITORY"

          echo "Application environment variables updated successfully."

